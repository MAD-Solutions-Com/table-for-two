<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Florist&#39;s Last Order: choose your version</title><style>
body{margin:0;min-height:100vh;background:#f6e4ea;color:#3b3340;font:17px/1.5 Georgia,serif;display:flex;justify-content:center}
main{max-width:520px;width:100%;padding:28px 18px}h1{font-weight:500;font-size:34px;line-height:1.15;margin:8px 0 6px;text-align:center}
.sub{text-align:center;opacity:.8;margin:0 0 22px}.card{background:#ffffff;color:#3b3340;padding:18px;border-radius:6px}
.card p{margin:0 0 12px}.v{display:block;border:2px solid #6fa36b;border-radius:6px;padding:12px 14px;margin:10px 0;color:#3b3340;text-decoration:none}
.v b{display:block;font:700 15px Arial,sans-serif;letter-spacing:.08em}.v span{font-size:15px;opacity:.85}.v.last{background:#fff8e6}
.v.last b:after{content:"  · last played here";font-weight:400;letter-spacing:0;opacity:.7}.msg{color:#a33a2c;font-size:15px}
</style></head><body><main><h1>The Florist&#39;s Last Order</h1><p class="sub">Companion page</p><div class="card">
<p><b>Which version did you print?</b> It says so at the bottom of every printed page: <i>prototype v&hellip;</i></p>
<p class="msg" id="msg" hidden></p><a class="v" href="play-v0.10.html" data-v="v0.10"><b>Prototype v0.10</b><span>Current test version.</span></a></div></main><script>
const K=["v0.10"],KEY='florist-version';const q=new URLSearchParams(location.search);let v=q.get('v');
if(v!==null){v=v.trim().toLowerCase();if(v&&v[0]!=='v')v='v'+v;
 if(K.includes(v)){try{localStorage.setItem(KEY,v)}catch(e){}location.replace('play-'+v+'.html');}
 else if(q.get('v')!==''){const m=document.getElementById('msg');m.hidden=false;m.textContent='This page does not know version '+q.get('v')+'. Pick the one printed on your pages:';}}
let last=null;try{last=localStorage.getItem(KEY)}catch(e){}
document.querySelectorAll('.v').forEach(a=>{if(a.dataset.v===last)a.classList.add('last');a.onclick=()=>{try{localStorage.setItem(KEY,a.dataset.v)}catch(e){}};});
</script></body></html>
